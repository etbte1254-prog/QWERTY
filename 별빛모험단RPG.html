<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18223b"><title>별빛 모험단 - 도트 횡스크롤 RPG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#192442;color:#fff;font-family:system-ui,"Malgun Gothic",sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none;text-shadow:1px 2px #172033}.panel{position:absolute;background:#17223cE8;border:2px solid #8794b688;border-radius:10px;padding:8px 11px}.status{left:10px;top:10px;width:210px}.charname{font-weight:900;font-size:13px}.small{font-size:11px;color:#d9e3ff}.bar{height:8px;background:#282c42;border:1px solid #080d1a;border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:100%}.hp i{background:#f26075}.mp i{background:#4cb5f2}.xp i{background:#b3df54}.mapname{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:17px;font-weight:900}.money{right:10px;top:10px;color:#ffe079;font-weight:900}.quest{left:10px;top:108px;width:210px;font-size:12px}.quest b{color:#ffe27a}.qtitle{font-weight:800;margin-bottom:4px}.bottom{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:10px;color:#e5e9f4;background:#17223ca8;padding:5px 9px;border-radius:8px;white-space:nowrap}.controls{position:absolute;inset:0;pointer-events:none}.stick{position:absolute;left:20px;bottom:22px;width:112px;height:112px;border-radius:50%;background:#c9d8ff25;border:2px solid #d5e0ff60;pointer-events:auto}.nub{position:absolute;left:35px;top:35px;width:38px;height:38px;border-radius:50%;background:#e5edff88}.buttons{position:absolute;right:12px;bottom:18px;display:flex;gap:6px;align-items:end;pointer-events:auto}.btn{border:2px solid #fff7;border-radius:50%;width:57px;height:57px;background:#354b75;color:#fff;font-weight:900;font-size:11px;text-shadow:1px 1px #111;touch-action:none}.btn.hit{width:72px;height:72px;background:#bd715c}.btn.use{background:#467b62}.btn:active{filter:brightness(1.3)}.overlay{position:fixed;inset:0;background:#080e1bb8;display:none;align-items:center;justify-content:center;pointer-events:auto;padding:16px}.overlay.show{display:flex}.modal{width:min(440px,100%);max-height:85vh;overflow:auto;background:#202d4a;border:3px solid #9faed0;border-radius:12px;padding:16px;box-shadow:0 12px 50px #0009}.modal h2{margin:0 0 10px;color:#ffe17a;font-size:20px}.modal p{font-size:14px;line-height:1.55}.modal button,.toolbar button{border:1px solid #ffffff55;border-radius:7px;background:#526b9d;color:white;padding:9px 11px;margin:4px;font-weight:800}.modal button:disabled{opacity:.45}.toolbar{position:absolute;right:10px;top:65px;display:flex;gap:5px;pointer-events:auto}.toolbar button{font-size:11px;padding:7px 8px;margin:0;background:#233352e8}.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-size:19px;font-weight:900;color:#ffe678;opacity:0;transition:opacity .2s;white-space:nowrap}.toast.on{opacity:1}.touchonly{display:none}@media(pointer:coarse),(max-width:760px){.touchonly{display:block}.bottom{display:none}.status{width:174px}.quest{top:103px;width:174px}.mapname{top:68px;font-size:14px}.toolbar{top:10px;right:96px}.toolbar button{padding:7px 6px;font-size:10px}.btn{width:49px;height:49px;font-size:9px}.btn.hit{width:63px;height:63px}.buttons{gap:4px}}
</style></head><body>
<canvas id="game"></canvas><div class="hud">
<div class="panel status"><div class="charname" id="who">초보 모험가</div><div class="small" id="level">Lv.1 · 초보자</div><div class="bar hp"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div><div class="bar xp"><i id="xpbar"></i></div><div class="small" id="xptext">경험치 0 / 40</div></div>
<div class="mapname" id="maplabel">별빛 마을</div><div class="panel money" id="money">메소 0</div>
<div class="panel quest"><b>📜 진행 중인 의뢰</b><div class="qtitle" id="qtitle">안내자 리아를 만나보세요</div><div class="small" id="qdesc">마을 가운데의 안내자에게 다가가 대화하세요.</div></div>
<div class="toolbar"><button id="questBtn">의뢰</button><button id="invBtn">가방</button><button id="equipBtn">장비</button><button id="skillBtn">기술</button><button id="saveBtn">저장</button></div>
<div class="toast" id="toast"></div><div class="bottom">이동 A/D 또는 ←/→ · 점프 Space · 공격 X · 기술 C · NPC 대화 ↑</div>
<div class="controls"><div class="stick touchonly" id="stick"><div class="nub" id="nub"></div></div><div class="buttons touchonly"><button class="btn use" id="talk">대화<br>↑</button><button class="btn" id="jump">점프</button><button class="btn" id="skill">기술<br>C</button><button class="btn hit" id="attack">공격</button></div></div></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), canvas=$('#game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const maps=[
 {name:'별빛 마을',w:1500,ground:620,sky:['#89bed9','#e8d4a2'],safe:true,plats:[{x:0,y:620,w:1500,h:180},{x:360,y:510,w:170,h:20},{x:800,y:480,w:170,h:20}],npcs:[{x:420,name:'리아',kind:'guide'},{x:1120,name:'대장장이 도윤',kind:'smith'}],portals:[{x:1430,to:1,label:'숲으로'}],mobs:[]},
 {name:'속삭임 숲',w:1900,ground:660,sky:['#77abc3','#9fc775'],safe:false,plats:[{x:0,y:660,w:1900,h:180},{x:340,y:540,w:180,h:18},{x:780,y:470,w:210,h:18},{x:1260,y:540,w:200,h:18}],npcs:[{x:1600,name:'수습 사냥꾼',kind:'quest'}],portals:[{x:30,to:0,label:'마을로'},{x:1830,to:2,label:'동굴로'}],mobs:['초록달팽이','꽃버섯']},
 {name:'수정 동굴',w:1700,ground:660,sky:['#394b77','#664d79'],safe:false,plats:[{x:0,y:660,w:1700,h:180},{x:400,y:525,w:190,h:18},{x:940,y:460,w:220,h:18}],npcs:[],portals:[{x:30,to:1,label:'숲으로'}],mobs:['반짝 박쥐','수정 골렘']}
];
let mapId=0,cam={x:0,y:0},keys={},stickX=0,attackHeld=false,toastTimer=0,dialogue=null;
const hero={x:170,y:572,w:28,h:48,vx:0,vy:0,dir:1,grounded:true,hp:100,maxHp:100,mp:55,maxMp:55,lv:1,xp:0,next:40,meso:80,job:'초보자',atk:12,def:0,atkCd:0,skillCd:0,inv:0,statPoints:0};
let inventory=[{name:'빨간 물약',type:'consumable',count:3,desc:'HP를 45 회복합니다.'},{name:'초보자의 낡은 검',type:'weapon',power:2,desc:'초보자용 무기. 공격력 +2'}];
let equipment={무기:null,모자:null,갑옷:null,신발:null},mobs=[],particles=[],drops=[],questState={started:false,slimes:0,shrooms:0,cave:0,turned:false},elapsed=0;
const mobStats={'초록달팽이':{hp:24,exp:10,meso:8,color:'#79b957',w:32,h:28,dmg:5},'꽃버섯':{hp:48,exp:18,meso:14,color:'#de8498',w:34,h:38,dmg:8},'반짝 박쥐':{hp:62,exp:25,meso:20,color:'#8b83d4',w:36,h:30,dmg:11},'수정 골렘':{hp:125,exp:48,meso:38,color:'#5dc5d4',w:48,h:52,dmg:16}};
const quests=[{name:'숲의 작은 소동',desc:'초록달팽이 5마리 처치',reward:'경험치 45 · 메소 60 · 빨간 물약 2개'},{name:'버섯 표본 수집',desc:'꽃버섯 3마리 처치',reward:'경험치 70 · 메소 90 · 초보자 모자'},{name:'동굴의 빛',desc:'수정 동굴에서 수정 골렘 2마리 처치',reward:'경험치 120 · 메소 160 · 별가루 검'}];
function currentQuest(){return questState.started&&!questState.turned?quests[questIndex]:null}let questIndex=0;
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');toastTimer=2.2}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function addMob(name,x){let st=mobStats[name],m={name,x,y:maps[mapId].ground-st.h,w:st.w,h:st.h,hp:st.hp,max:st.hp,exp:st.exp,meso:st.meso,color:st.color,dmg:st.dmg,dir:-1,cd:0,dead:false,hit:0};mobs.push(m)}
function populate(){mobs=[];let m=maps[mapId];if(m.safe)return;if(mapId===1){for(let i=0;i<5;i++)addMob('초록달팽이',280+i*250);for(let i=0;i<3;i++)addMob('꽃버섯',600+i*390)}else{for(let i=0;i<4;i++)addMob('반짝 박쥐',300+i*370);for(let i=0;i<3;i++)addMob('수정 골렘',520+i*470)}}populate();
function groundY(){return maps[mapId].ground}
function addExp(n){hero.xp+=n;while(hero.xp>=hero.next){hero.xp-=hero.next;hero.lv++;hero.next=Math.floor(hero.next*1.35);hero.maxHp+=12;hero.maxMp+=6;hero.hp=hero.maxHp;hero.mp=hero.maxMp;hero.statPoints+=3;toast(`레벨 업! Lv.${hero.lv} · 스탯 포인트 +3`);if(hero.lv>=10&&hero.job==='초보자')toast('Lv.10 달성! 마을의 리아에게 전직 의뢰를 받아보세요.')}}
function hit(m,d){if(m.dead)return;m.hp-=d;m.hit=.15;for(let i=0;i<5;i++)particles.push({x:m.x+m.w/2,y:m.y+8,vx:(Math.random()-.5)*140,vy:-70-Math.random()*100,life:.45,color:m.color});if(m.hp<=0){m.dead=true;hero.meso+=m.meso;addExp(m.exp);if(m.name==='초록달팽이')questState.slimes++;if(m.name==='꽃버섯')questState.shrooms++;if(m.name==='수정 골렘')questState.cave++;if(Math.random()<.2)drops.push({x:m.x,y:m.y-12,name:'빨간 물약'});updateQuestUI();toast(`${m.name} 처치 · 경험치 ${m.exp}`)}}
function attack(){if(hero.atkCd>0)return;hero.atkCd=.32;let reach=hero.job==='검투사'?94:76;for(const m of mobs)if(!m.dead&&Math.abs((m.x+m.w/2)-(hero.x+hero.w/2))<reach&&Math.abs(m.y-hero.y)<70&&(m.x-hero.x)*hero.dir>-20)hit(m,hero.atk+(hero.job==='검투사'?8:0));for(let i=0;i<7;i++)particles.push({x:hero.x+hero.w/2+hero.dir*28,y:hero.y+25,vx:hero.dir*(60+Math.random()*180),vy:(Math.random()-.5)*170,life:.2,color:'#ffe993'})}
function useSkill(){if(hero.skillCd>0||hero.mp<18){toast(hero.mp<18?'MP가 부족해요':'기술은 재사용 대기 중이에요');return}hero.mp-=18;hero.skillCd=3.5;let reach=hero.job==='마도사'?210:130;for(const m of mobs)if(!m.dead&&Math.abs((m.x+m.w/2)-(hero.x+hero.w/2))<reach&&Math.abs(m.y-hero.y)<100)hit(m,hero.atk*2+18);for(let i=0;i<18;i++)particles.push({x:hero.x+hero.w/2+hero.dir*35,y:hero.y+20,vx:hero.dir*(80+Math.random()*240),vy:(Math.random()-.5)*200,life:.45,color:hero.job==='마도사'?'#81d7ff':'#ffe66e'})}
function jump(){if(hero.grounded){hero.vy=-570;hero.grounded=false}}
function nearNpc(){let list=maps[mapId].npcs||[];return list.find(n=>Math.abs(n.x-hero.x)<75)}
function interact(){let npc=nearNpc();if(npc){openNpc(npc);return}let portal=maps[mapId].portals.find(a=>Math.abs(a.x-hero.x)<65);if(portal){mapId=portal.to;hero.x=mapId===0?1350:mapId===1?80:80;hero.y=groundY()-hero.h;populate();$('#maplabel').textContent=maps[mapId].name;toast(`${maps[mapId].name}에 도착했습니다`);return}toast('대화할 사람이나 포털 가까이로 가세요')}
function openNpc(npc){if(npc.kind==='guide'){if(hero.lv>=10&&hero.job==='초보자'){showModal(`<h2>리아 · 전직 안내</h2><p>Lv.10을 달성했군요! 어떤 길을 걷고 싶나요? 선택한 직업은 모험을 바꿔 줄 거예요.</p><button onclick="advanceJob('검투사')">검투사 · 근접 공격 강화</button><button onclick="advanceJob('마도사')">마도사 · 넓은 마법 공격</button><button onclick="advanceJob('궁수')">궁수 · 빠르고 긴 공격</button>`)}else if(questIndex>=3){showModal('<h2>리아</h2><p>당신은 훌륭한 모험가예요. 아직 더 먼 길이 기다리고 있답니다!</p><button onclick="closeModal()">닫기</button>')}else if(!questState.started){questState.started=true;questState.turned=false;toast('새 의뢰: 숲의 작은 소동');showModal(`<h2>리아의 의뢰</h2><p>숲에 초록달팽이가 너무 많아졌어요. 5마리를 처치하고 돌아와 주세요!</p><button onclick="closeModal()">의뢰 받기</button>`);updateQuestUI()}else if(isQuestDone()){completeQuest()}else showModal(`<h2>리아</h2><p>${questIndex===0?'초록달팽이':questIndex===1?'꽃버섯':'수정 골렘'} 처치를 부탁해요. 진행 상황은 왼쪽 의뢰 창에서 확인할 수 있어요.</p><button onclick="closeModal()">알겠어요</button>`)}else if(npc.kind==='smith'){showModal(`<h2>대장장이 도윤</h2><p>메소로 장비를 강화할 수 있어요. 장비가 있으면 가방에서 장착해 보세요.</p><button onclick="buyPotion()">빨간 물약 1개 · 25 메소</button><button onclick="closeModal()">나중에</button>`)}else{if(questIndex===0&&isQuestDone())completeQuest();else showModal(`<h2>${npc.name}</h2><p>숲길은 미끄러우니 조심하세요! 의뢰를 달성했다면 마을의 리아에게 돌아가세요.</p><button onclick="closeModal()">확인</button>`)}}
function isQuestDone(){return questIndex===0?questState.slimes>=5:questIndex===1?questState.shrooms>=3:questState.cave>=2}
function completeQuest(){if(!isQuestDone()){toast('아직 의뢰 목표를 달성하지 못했어요');return}let q=quests[questIndex];hero.meso+=[60,90,160][questIndex];addExp([45,70,120][questIndex]);if(questIndex===1)inventory.push({name:'초보자 모자',type:'모자',power:2,desc:'작은 방어구. 방어력 +2'});if(questIndex===2)inventory.push({name:'별가루 검',type:'무기',power:8,desc:'별빛이 깃든 검. 공격력 +8'});inventory.push({name:'빨간 물약',type:'consumable',count:2,desc:'HP를 45 회복합니다.'});questIndex++;questState.started=false;questState.turned=true;toast('의뢰 완료! 보상을 받았습니다');closeModal();updateQuestUI();save()}
function advanceJob(job){hero.job=job;hero.atk+=job==='검투사'?8:job==='궁수'?5:4;hero.maxMp+=job==='마도사'?25:8;hero.mp=hero.maxMp;toast(`${job}(으)로 전직했습니다!`);closeModal();updateStatus();save()}
function buyPotion(){if(hero.meso<25){toast('메소가 부족해요');return}hero.meso-=25;let item=inventory.find(i=>i.name==='빨간 물약');if(item)item.count++;else inventory.push({name:'빨간 물약',type:'consumable',count:1,desc:'HP를 45 회복합니다.'});closeModal();toast('빨간 물약을 샀어요');updateStatus()}
function showModal(html){$('#modal').innerHTML=html;$('#overlay').classList.add('show')}function closeModal(){$('#overlay').classList.remove('show')}
$('#overlay').addEventListener('pointerdown',e=>{if(e.target.id==='overlay')closeModal()});
function updateQuestUI(){let i=questIndex;if(i>=3){$('#qtitle').textContent='의뢰 완료';$('#qdesc').textContent='새로운 모험을 찾아 떠나세요.';return}if(!questState.started){$('#qtitle').textContent=i===0?'리아를 만나 의뢰 받기':`${quests[i].name} · 리아에게 대화`;$('#qdesc').textContent=i===0?'마을의 리아에게 다가가 ↑ 버튼으로 대화하세요.':'완료 보상을 받고 다음 의뢰를 받아보세요.'}else{$('#qtitle').textContent=quests[i].name;$('#qdesc').textContent=quests[i].desc+' · '+(i===0?questState.slimes+'/5':i===1?questState.shrooms+'/3':questState.cave+'/2')}}
function updateStatus(){$('#who').textContent=hero.job==='초보자'?'초보 모험가':`${hero.job} 모험가`;$('#level').textContent=`Lv.${hero.lv} · ${hero.job}`;$('#hpbar').style.width=100*hero.hp/hero.maxHp+'%';$('#mpbar').style.width=100*hero.mp/hero.maxMp+'%';$('#xpbar').style.width=100*hero.xp/hero.next+'%';$('#xptext').textContent=`경험치 ${hero.xp} / ${hero.next}`;$('#money').textContent=`메소 ${hero.meso}`;$('#maplabel').textContent=maps[mapId].name}
function showInventory(type){let title=type==='inv'?'가방':type==='equip'?'장비':'기술';let content='';if(type==='inv'){content=inventory.length?inventory.map((it,i)=>`<p><b>${it.name}</b> ${it.count?`×${it.count}`:''}<br><span class="small">${it.desc}</span><br><button onclick="itemAction(${i})">${it.type==='consumable'?'사용':'장착'}</button></p>`).join(''):'<p>가방이 비어 있어요.</p>'}else if(type==='equip'){content='<p>장착 중인 장비</p>'+Object.entries(equipment).map(([k,v])=>`<p>${k}: ${v||'없음'}</p>`).join('')+`<p>공격력 ${hero.atk} · 방어력 ${hero.def}</p>`}else{content=`<p><b>기본 공격</b> — X / 공격 버튼<br>적 앞에서 사용하세요.</p><p><b>${hero.job==='초보자'?'별빛 베기':hero.job==='마도사'?'별똥별 마법':hero.job==='궁수'?'관통 화살':'강철 회전베기'}</b> — C / 기술 버튼<br>MP 18 · 피해 ${hero.atk*2+18} · 재사용 3.5초</p><p>레벨이 오를 때마다 스탯 포인트 3을 얻습니다.</p><button onclick="spendStat('atk')">공격 +1 (포인트 ${hero.statPoints})</button><button onclick="spendStat('hp')">최대 HP +5</button>`}showModal(`<h2>${title}</h2>${content}<button onclick="closeModal()">닫기</button>`)}
function itemAction(i){let it=inventory[i];if(!it)return;if(it.type==='consumable'){if(hero.hp>=hero.maxHp){toast('HP가 이미 가득 차 있어요');return}hero.hp=Math.min(hero.maxHp,hero.hp+45);it.count--;if(it.count<=0)inventory.splice(i,1);showInventory('inv');updateStatus();toast('HP를 회복했습니다')}else{let slot=it.type==='weapon'?'무기':it.type;if(equipment[slot])inventory.push({name:equipment[slot],type:slot,power:2,desc:'장비'});equipment[slot]=it.name;if(slot==='무기')hero.atk+=it.power||0;else hero.def+=it.power||0;inventory.splice(i,1);showInventory('inv');toast(`${it.name} 장착!`)}}
function spendStat(t){if(hero.statPoints<1){toast('사용할 스탯 포인트가 없습니다');return}hero.statPoints--;if(t==='atk')hero.atk++;else{hero.maxHp+=5;hero.hp+=5}showInventory('skill');updateStatus()}
window.itemAction=itemAction;window.spendStat=spendStat;window.closeModal=closeModal;window.advanceJob=advanceJob;window.buyPotion=buyPotion;
$('#questBtn').onclick=()=>showModal(`<h2>의뢰 기록</h2>${quests.map((q,i)=>`<p><b>${i<questIndex?'✅':i===questIndex?'📜':'🔒'} ${q.name}</b><br>${q.desc}<br><span class="small">보상: ${q.reward}</span></p>`).join('')}<button onclick="closeModal()">닫기</button>`);$('#invBtn').onclick=()=>showInventory('inv');$('#equipBtn').onclick=()=>showInventory('equip');$('#skillBtn').onclick=()=>showInventory('skill');$('#saveBtn').onclick=()=>{save();toast('모험 기록을 저장했습니다')};
function save(){try{localStorage.setItem('star-adventure-save',JSON.stringify({hero,mapId,inventory,equipment,questState,questIndex}))}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem('star-adventure-save'));if(s){Object.assign(hero,s.hero);mapId=s.mapId||0;inventory=s.inventory||inventory;equipment=s.equipment||equipment;questState=s.questState||questState;questIndex=s.questIndex||0;populate();updateStatus();updateQuestUI()}}catch(e){}}
load();
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright','arrowup'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key==='ArrowUp'||e.key===' ')e.key===' '?jump():interact();if(e.key.toLowerCase()==='x')attack();if(e.key.toLowerCase()==='c')useSkill();if(e.key.toLowerCase()==='i')showInventory('inv');if(e.key.toLowerCase()==='q')$('#questBtn').click()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const stick=$('#stick'),nub=$('#nub');let stickId=null;stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});function moveStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),k=Math.min(36,l)/Math.max(l,1);dx*=k;dy*=k;nub.style.transform=`translate(${dx}px,${dy}px)`;stickX=dx/36}function clearStick(){stickId=null;stickX=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',clearStick);stick.addEventListener('pointercancel',clearStick);
$('#attack').addEventListener('pointerdown',e=>{e.preventDefault();attackHeld=true});$('#attack').addEventListener('pointerup',()=>attackHeld=false);$('#attack').addEventListener('pointercancel',()=>attackHeld=false);$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#skill').addEventListener('pointerdown',e=>{e.preventDefault();useSkill()});$('#talk').addEventListener('pointerdown',e=>{e.preventDefault();interact()});
function update(dt){elapsed+=dt;hero.atkCd=Math.max(0,hero.atkCd-dt);hero.skillCd=Math.max(0,hero.skillCd-dt);hero.inv=Math.max(0,hero.inv-dt);hero.mp=Math.min(hero.maxMp,hero.mp+2*dt);let m=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(Math.abs(stickX)>.18)m=stickX;if(m){hero.vx+=m*1700*dt;hero.vx=clamp(hero.vx,-210,210);hero.dir=Math.sign(m)}else hero.vx*=Math.pow(.001,dt);let oldBottom=hero.y+hero.h;hero.vy+=1450*dt;hero.x+=hero.vx*dt;hero.y+=hero.vy*dt;hero.grounded=false;let map=maps[mapId];for(let pl of map.plats){if(hero.vy>=0&&oldBottom<=pl.y+4&&hero.y+hero.h>=pl.y&&hero.x+hero.w>pl.x&&hero.x<pl.x+pl.w){hero.y=pl.y-hero.h;hero.vy=0;hero.grounded=true}}hero.x=clamp(hero.x,0,map.w-hero.w);if(hero.y>H+map.ground){hero.y=map.ground-hero.h;hero.vy=0;hero.hp=Math.max(1,hero.hp-10)}if((keys[' ']||keys.arrowup)&&hero.grounded)jump();if(attackHeld||keys.x)attack();
 for(let mob of mobs){if(mob.dead)continue;mob.hit-=dt;mob.cd-=dt;if(Math.abs(mob.x-hero.x)<300){mob.dir=mob.x<hero.x?1:-1;mob.x+=mob.dir*25*dt}if(Math.abs(mob.x-hero.x)<27&&Math.abs(mob.y-hero.y)<42&&mob.cd<=0&&hero.inv<=0&&!map.safe){mob.cd=1;hero.hp-=Math.max(1,mob.dmg-hero.def);hero.inv=.8;hero.vx=mob.x<hero.x?190:-190;hero.vy=-160;if(hero.hp<=0){hero.hp=hero.maxHp;hero.x=100;hero.y=map.ground-hero.h;hero.meso=Math.max(0,hero.meso-10);toast('기절했어요. 메소 10을 잃었습니다.')}}}
 particles.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=400*dt;a.life-=dt});particles=particles.filter(a=>a.life>0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('on')}cam.x=clamp(hero.x-W*.43,0,Math.max(0,map.w-W));cam.y=clamp(hero.y-H*.55,-80,Math.max(-80,map.ground-H));updateStatus()}
function box(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function draw(){let map=maps[mapId];ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));let g=ctx.createLinearGradient(0,cam.y,0,cam.y+H);g.addColorStop(0,map.sky[0]);g.addColorStop(1,map.sky[1]);ctx.fillStyle=g;ctx.fillRect(cam.x,cam.y,W,H);
 // parallax clouds and far hills
 for(let i=0;i<8;i++){let x=i*280-(cam.x*.15%280)+40,y=90+(i%3)*36;box(x,y,70,13,'#fff7');box(x+18,y-10,42,12,'#fff8')}
 ctx.fillStyle=map.safe?'#78a77a':'#5f9065';for(let i=0;i<11;i++){let x=i*220-cam.x*.3%220,y=map.ground-48-(i%3)*22;ctx.beginPath();ctx.moveTo(x,y+100);ctx.lineTo(x+95,y-100);ctx.lineTo(x+210,y+100);ctx.fill()}
 for(let pl of map.plats){box(pl.x,pl.y,pl.w,pl.h,mapId===2?'#514c67':'#66513b');for(let x=pl.x;x<pl.x+pl.w;x+=26){box(x,pl.y,24,7,mapId===2?'#75a8a2':'#82b75c');box(x+7,pl.y+8,12,Math.max(3,pl.h-8),mapId===2?'#77718b':'#81694c')}}
 if(map.safe){box(200,groundY()-80,100,80,'#8e6849');box(187,groundY()-100,126,25,'#b17f4b');box(235,groundY()-42,28,42,'#e5bf70');for(let i=0;i<4;i++){let x=660+i*175;box(x,groundY()-45,16,45,'#765537');box(x-30,groundY()-75,75,45,'#478353');box(x-18,groundY()-98,52,36,'#5b9c5e')}}else{for(let i=0;i<10;i++){let x=i*220+55;box(x,groundY()-90,13,90,mapId===2?'#746b78':'#70543a');box(x-35,groundY()-125,83,56,mapId===2?'#526e83':'#347350');box(x-20,groundY()-151,55,42,mapId===2?'#63869a':'#4a8d59')}}
 for(let npc of map.npcs){box(npc.x,groundY()-54,28,54,'#5c4c74');box(npc.x+3,groundY()-72,22,22,'#e2b185');box(npc.x+2,groundY()-79,23,11,'#664d44');ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(npc.name,npc.x+14,groundY()-83);if(Math.abs(npc.x-hero.x)<90){ctx.fillStyle='#fff0a0';ctx.fillText('↑ 대화',npc.x+14,groundY()-99)}}
 for(let portal of map.portals){box(portal.x,groundY()-92,54,92,'#415b7a');box(portal.x+8,groundY()-82,38,78,'#79d5dc');box(portal.x+13,groundY()-74,28,67,'#b4f0e2');ctx.fillStyle='#fff';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText(portal.label,portal.x+27,groundY()-102)}
 for(let mob of mobs){if(mob.dead)continue;box(mob.x,mob.y+mob.h-7,mob.w,7,'#40553b');box(mob.x+3,mob.y+5,mob.w-6,mob.h-9,mob.hit>0?'#fff':mob.color);box(mob.x+6,mob.y+mob.h-12,mob.w-12,7,'#a8cd74');box(mob.x+8,mob.y+9,5,5,'#272e45');box(mob.x+mob.w-13,mob.y+9,5,5,'#272e45');box(mob.x,mob.y-8,mob.w,4,'#34283d');box(mob.x,mob.y-8,mob.w*mob.hp/mob.max,4,'#f06770');ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(mob.name,mob.x+mob.w/2,mob.y-12)}
 for(let d of drops){box(d.x,d.y,12,12,'#f26464')}
 // pixel adventurer, with animated legs and hair
 let bob=hero.grounded&&Math.abs(hero.vx)>15?Math.sin(elapsed*15)*2:0;ctx.save();ctx.translate(Math.round(hero.x+hero.w/2),Math.round(hero.y+bob));ctx.scale(hero.dir,1);ctx.globalAlpha=hero.inv>0&&Math.floor(elapsed*12)%2?.45:1;box(-12,34,10,13,'#4e3b32');box(3,34,10,13,'#4e3b32');box(-13,15,26,22,hero.job==='마도사'?'#6258a0':hero.job==='궁수'?'#4c8560':'#46619a');box(-10,19,20,12,'#758bc7');box(-11,1,22,17,'#e4b080');box(-11,-5,22,9,'#69473c');box(-9,-9,18,6,'#75503e');box(-8,5,4,4,'#29354d');box(4,5,4,4,'#29354d');box(-17,5,7,23,'#e4b080');box(10,5,7,23,'#e4b080');box(13,16,20,4,hero.job==='마도사'?'#9ae2ff':'#d9d9e7');ctx.restore();ctx.globalAlpha=1;
 for(let a of particles)box(a.x,a.y,4,4,a.color);ctx.restore();}
function frame(t){let dt=Math.min(.034,(t-(frame.t||t))/1000);frame.t=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);updateQuestUI();updateStatus();
