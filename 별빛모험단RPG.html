<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#18223b"><title>별빛 모험단 · 가로형 RPG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17223c;color:#fff;font-family:system-ui,"Malgun Gothic",sans-serif;touch-action:none;user-select:none}canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}.hud{position:fixed;inset:0;pointer-events:none;text-shadow:1px 2px #172033}.panel{position:absolute;background:linear-gradient(180deg,#263758ed,#151f37e8);border:1px solid #d5d9ec88;border-radius:8px;box-shadow:0 3px 8px #0006;padding:6px 9px}.status{left:10px;top:9px;width:210px;height:60px}.portrait{float:left;width:40px;height:40px;margin-right:8px;border:2px solid #b7c9e8;border-radius:6px;background:#d9aa78;box-shadow:inset 0 -12px #52669a;position:relative}.portrait:before{content:"";position:absolute;left:5px;top:3px;width:25px;height:9px;background:#624438;border-radius:6px}.portrait:after{content:"••";position:absolute;left:9px;top:13px;color:#26324c;font-size:12px;letter-spacing:5px}.charname{font-size:12px;font-weight:900}.level{font-size:10px;color:#fce68b;margin-bottom:3px}.bars{display:flex;gap:3px;flex-direction:column}.bar{height:7px;background:#101629;border:1px solid #0a1020;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:100%}.hp i{background:linear-gradient(90deg,#f04762,#ff8580)}.mp i{background:linear-gradient(90deg,#318de4,#70d8ff)}.xp i{background:#a6d54d}.field{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:6px 14px;font-weight:900;font-size:13px;letter-spacing:.5px}.right{position:absolute;right:9px;top:9px;display:flex;align-items:flex-start;gap:6px}.minimap{width:125px;height:66px;background:#132037e8;border:2px solid #aeb8ceaa;border-radius:7px;padding:5px;position:relative}.minimap b{font-size:9px;color:#ffe78e;display:block}.mapline{height:28px;margin-top:3px;background:linear-gradient(180deg,#486e58,#728051);border:1px solid #c7d39a55;position:relative}.dot{position:absolute;left:48%;top:12px;width:6px;height:6px;border-radius:50%;background:#ffe575;box-shadow:0 0 6px #fff}.mobdot{position:absolute;left:68%;top:8px;width:4px;height:4px;border-radius:50%;background:#f47772}.menu{display:grid;grid-template-columns:repeat(2,42px);gap:4px;pointer-events:auto}.menu button{height:30px;border:1px solid #dce5ff88;border-radius:6px;background:linear-gradient(#53668e,#293958);color:#fff;font-weight:800;font-size:9px;text-shadow:1px 1px #111;padding:0}.quest{right:10px;top:84px;width:195px;min-height:54px;font-size:10px}.quest b{display:block;color:#ffdf80;font-size:11px;margin-bottom:3px}.quest .sub{color:#d9e3fa}.meso{position:absolute;right:10px;top:144px;color:#ffdf77;font-size:11px;font-weight:900}.chat{position:absolute;left:10px;bottom:10px;width:220px;min-height:34px;background:#17233ba8;border:1px solid #ffffff3b;border-radius:6px;padding:5px 8px;font-size:9px;color:#e3e8f4}.chat span{color:#ffe27b}.stick{position:absolute;left:19px;bottom:56px;width:104px;height:104px;border:2px solid #d7e2ff70;border-radius:50%;background:#e2ecff20;pointer-events:auto}.nub{position:absolute;left:31px;top:31px;width:38px;height:38px;border-radius:50%;background:#e2ecff8a;box-shadow:inset 0 0 0 2px #fff3}.hotbar{position:absolute;right:13px;bottom:17px;display:flex;align-items:flex-end;gap:7px;pointer-events:auto}.skill{position:relative;width:49px;height:49px;border:2px solid #e1e9ffad;border-radius:50%;background:radial-gradient(circle at 35% 25%,#8c81d2,#373466 70%);color:white;font-size:9px;font-weight:900;text-shadow:1px 1px #111;box-shadow:0 2px 6px #0008;touch-action:none}.skill.attack{width:65px;height:65px;background:radial-gradient(circle at 35% 25%,#e09a70,#9a493c 72%);font-size:12px}.skill.jump{background:radial-gradient(circle at 35% 25%,#79c99d,#34725b 72%)}.skill.potion{background:radial-gradient(circle at 35% 25%,#ef8290,#a6415b 72%)}.skill:active{transform:scale(.94)}.cool{position:absolute;inset:0;border-radius:50%;background:#10182b99;display:none;align-items:center;justify-content:center}.toast{position:absolute;top:23%;left:50%;transform:translateX(-50%);font-size:16px;font-weight:900;color:#fff0a0;padding:7px 13px;background:#17223ddd;border:1px solid #ffe39388;border-radius:8px;opacity:0;transition:opacity .2s;white-space:nowrap}.toast.on{opacity:1}.rotate{display:none;position:fixed;inset:0;z-index:10;background:#111b32;color:#fff;align-items:center;justify-content:center;text-align:center;padding:25px;font-weight:800}.modalback{position:fixed;inset:0;z-index:8;background:#080e1bbd;display:none;align-items:center;justify-content:center;padding:14px;pointer-events:auto}.modalback.show{display:flex}.modal{width:min(430px,94vw);max-height:85vh;overflow:auto;padding:16px;background:linear-gradient(#344568,#1a2742);border:2px solid #dfd6b7;border-radius:10px;box-shadow:0 10px 40px #0009}.modal h2{color:#ffe28a;font-size:18px;margin:0 0 9px}.modal p{font-size:12px;line-height:1.55}.modal button{padding:8px 11px;margin:3px;border:1px solid #fff7;border-radius:6px;background:#536d9c;color:white;font-weight:800;font-size:11px}.modal button:disabled{opacity:.5}.talk{position:absolute;left:132px;bottom:82px;width:54px;height:38px;pointer-events:auto;border:1px solid #fff9;border-radius:7px;background:#283c61;color:white;font-size:10px;font-weight:900;display:none}.talk.show{display:block}.bottomtip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;color:#fff9;background:#17233ba8;padding:5px 9px;border-radius:7px;white-space:nowrap}
@media (orientation:portrait) and (max-width:800px){.rotate{display:flex}.rotate .phone{font-size:38px;display:block;margin-bottom:12px}.rotate .message{font-size:15px;line-height:1.6}}
@media(max-height:420px){.status{transform:scale(.9);transform-origin:top left}.quest{top:73px}.meso{top:132px}.stick{width:90px;height:90px;bottom:43px}.nub{left:26px;top:26px}.chat{bottom:4px}.hotbar{bottom:9px;gap:5px}.skill{width:44px;height:44px}.skill.attack{width:57px;height:57px}.bottomtip{display:none}}
</style></head><body>
<canvas id="game"></canvas>
<div class="hud">
 <div class="panel status"><div class="portrait"></div><div class="charname" id="who">별빛 모험가</div><div class="level" id="level">Lv.1 · 초보자</div><div class="bars"><div class="bar hp"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div><div class="bar xp"><i id="xpbar"></i></div></div></div>
 <div class="panel field" id="field">별빛 마을</div>
 <div class="right"><div class="minimap"><b>미니맵 · <span id="miniName">마을</span></b><div class="mapline"><i class="dot"></i><i class="mobdot"></i></div></div><div class="menu"><button id="questBtn">의뢰</button><button id="bagBtn">가방</button><button id="equipBtn">장비</button><button id="skillBtn">스킬</button></div></div>
 <div class="panel quest"><b>★ 오늘의 의뢰</b><div id="qtitle">리아에게 말을 걸어보세요</div><div class="sub" id="qdesc">마을에서 안내자를 찾아보세요.</div></div><div class="meso" id="meso">메소 80</div>
 <button class="talk" id="talk">대화</button><div class="stick" id="stick"><div class="nub" id="nub"></div></div>
 <div class="hotbar"><button class="skill potion" id="potion">물약<br><small id="pcount">3</small></button><button class="skill jump" id="jump">점프</button><button class="skill" id="special">스킬<br><small id="skillcd"></small></button><button class="skill attack" id="attack">공격</button></div>
 <div class="chat" id="chat"><span>[안내]</span> 별빛 모험단에 오신 걸 환영해요!</div><div class="bottomtip">가로 화면 조작 · 왼쪽 스틱 이동 · 오른쪽 버튼 점프/공격</div><div class="toast" id="toast"></div>
</div>
<div class="rotate"><div><span class="phone">📱 ↻</span><div class="message">게임을 가로 화면으로 돌려 주세요!<br><small>화면 회전을 켜면 플레이할 수 있어요.</small></div></div></div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div>
<script>
'use strict';const $=s=>document.querySelector(s),cv=$('#game'),cx=cv.getContext('2d');let W=innerWidth,H=innerHeight,D=1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const zones=[{name:'별빛 마을',short:'마을',w:1500,g:570,safe:true,sky:['#8bc2dc','#e7d6a5'],plats:[{x:0,y:570,w:1500,h:180},{x:350,y:470,w:180,h:18},{x:790,y:435,w:190,h:18}],npcs:[{x:390,name:'리아',kind:'guide'},{x:1090,name:'도윤',kind:'shop'}],portal:{x:1430,to:1}},{name:'속삭임 숲',short:'숲',w:1900,g:610,safe:false,sky:['#79adbf','#a6c77e'],plats:[{x:0,y:610,w:1900,h:180},{x:350,y:500,w:190,h:18},{x:810,y:430,w:210,h:18},{x:1280,y:500,w:190,h:18}],npcs:[{x:1600,name:'수습 사냥꾼',kind:'quest'}],portal:{x:30,to:0},monsters:['초록달팽이','꽃버섯']},{name:'수정 동굴',short:'동굴',w:1700,g:610,safe:false,sky:['#344777','#75537a'],plats:[{x:0,y:610,w:1700,h:180},{x:390,y:490,w:200,h:18},{x:930,y:420,w:210,h:18}],npcs:[],portal:{x:30,to:1},monsters:['반짝 박쥐','수정 골렘']}];
let zoneId=0,cam={x:0,y:0},keys={},moveX=0,attackHeld=false,toastTimer=0,t=0;
const hero={x:150,y:522,w:28,h:48,vx:0,vy:0,dir:1,ground:true,hp:100,maxHp:100,mp:55,maxMp:55,lv:1,xp:0,next:45,meso:80,job:'초보자',atk:12,def:0,atkCd:0,skillCd:0,inv:0,points:0};
let bag=[{name:'빨간 물약',type:'potion',count:3},{name:'여행자의 검',type:'weapon',power:2}],gear={무기:null,모자:null,갑옷:null},mobs=[],fx=[],quest=0,started=false,kills=0,mush=0,cave=0;
const stats={'초록달팽이':[25,10,8,'#75b75b',32,27,5],'꽃버섯':[46,18,14,'#dc8399',34,38,8],'반짝 박쥐':[62,25,20,'#9284cf',36,29,10],'수정 골렘':[120,48,38,'#59bdcf',47,50,15]};
const quests=[['숲의 작은 소동','초록달팽이 5마리 처치',5],['버섯 표본 수집','꽃버섯 3마리 처치',3],['동굴의 빛','수정 골렘 2마리 처치',2]];
function clamp(a,b,c){return Math.max(b,Math.min(c,a))}function say(s){$('#chat').innerHTML='<span>[안내]</span> '+s}function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');toastTimer=2}
function addMob(name,x){let s=stats[name];mobs.push({name,x,y:zones[zoneId].g-s[5],w:s[4],h:s[5],hp:s[0],max:s[0],exp:s[1],meso:s[2],color:s[3],dmg:s[6],cd:0,dead:false})}
function populate(){mobs=[];let z=zones[zoneId];if(z.safe)return;if(zoneId===1){for(let i=0;i<6;i++)addMob('초록달팽이',260+i*240);for(let i=0;i<3;i++)addMob('꽃버섯',600+i*410)}else{for(let i=0;i<4;i++)addMob('반짝 박쥐',300+i*370);for(let i=0;i<3;i++)addMob('수정 골렘',520+i*470)}}populate();
function exp(n){hero.xp+=n;while(hero.xp>=hero.next){hero.xp-=hero.next;hero.lv++;hero.next=Math.floor(hero.next*1.35);hero.maxHp+=12;hero.maxMp+=7;hero.hp=hero.maxHp;hero.mp=hero.maxMp;hero.points+=3;toast(`레벨 업! Lv.${hero.lv} · 스탯 포인트 +3`);if(hero.lv===10&&hero.job==='초보자')say('Lv.10 달성! 마을의 리아에게 전직을 신청하세요.')}}
function kill(m,d){if(m.dead)return;m.hp-=d;for(let i=0;i<6;i++)fx.push({x:m.x+m.w/2,y:m.y+8,vx:(Math.random()-.5)*140,vy:-80-Math.random()*100,life:.45,c:m.color});if(m.hp<=0){m.dead=true;hero.meso+=m.meso;exp(m.exp);if(m.name==='초록달팽이')kills++;if(m.name==='꽃버섯')mush++;if(m.name==='수정 골렘')cave++;say(`${m.name} 처치 · 경험치 ${m.exp}`);questUI()}}
function attack(){if(hero.atkCd>0)return;hero.atkCd=.3;for(let m of mobs)if(!m.dead&&Math.abs(m.x+m.w/2-(hero.x+hero.w/2))<(hero.job==='검투사'?100:76)&&Math.abs(m.y-hero.y)<70&&(m.x-hero.x)*hero.dir>-20)kill(m,hero.atk+(hero.job==='검투사'?8:0));for(let i=0;i<6;i++)fx.push({x:hero.x+14+hero.dir*28,y:hero.y+25,vx:hero.dir*(80+Math.random()*160),vy:(Math.random()-.5)*130,life:.2,c:'#fff09d'})}
function special(){if(hero.skillCd>0||hero.mp<18){toast(hero.mp<18?'MP가 부족해요':'스킬 재사용 대기 중');return}hero.mp-=18;hero.skillCd=3.5;for(let m of mobs)if(!m.dead&&Math.abs(m.x-hero.x)<(hero.job==='마도사'?220:135)&&Math.abs(m.y-hero.y)<95)kill(m,hero.atk*2+18);for(let i=0;i<16;i++)fx.push({x:hero.x+14,y:hero.y+22,vx:hero.dir*(80+Math.random()*220),vy:(Math.random()-.5)*190,life:.4,c:'#94e6ff'})}
function jump(){if(hero.ground){hero.vy=-570;hero.ground=false}}
function nearNpc(){return (zones[zoneId].npcs||[]).find(n=>Math.abs(n.x-hero.x)<75)}
function interact(){let n=nearNpc();if(n){npcAction(n);return}let po=zones[zoneId].portal;if(Math.abs(po.x-hero.x)<70){zoneId=po.to;hero.x=zoneId===0?1350:75;hero.y=zones[zoneId].g-hero.h;populate();$('#field').textContent=zones[zoneId].name;$('#miniName').textContent=zones[zoneId].short;toast(`${zones[zoneId].name} 입장`);return}toast('NPC 또는 포털 가까이로 이동하세요')}
function modal(html){$('#modal').innerHTML=html;$('#modalback').classList.add('show')}function closeModal(){$('#modalback').classList.remove('show')}$('#modalback').addEventListener('pointerdown',e=>{if(e.target.id==='modalback')closeModal()});
function npcAction(n){if(n.kind==='guide'){if(hero.lv>=10&&hero.job==='초보자'){modal(`<h2>리아 · 전직 안내</h2><p>어떤 길을 걷고 싶나요? 직업마다 공격 방식과 성장 방향이 달라집니다.</p><button onclick="jobUp('검투사')">검투사 · 근접 강화</button><button onclick="jobUp('마도사')">마도사 · 광역 마법</button><button onclick="jobUp('궁수')">궁수 · 빠른 공격</button><button onclick="closeModal()">나중에</button>`)}else if(quest>=3){modal('<h2>리아</h2><p>멋진 활약이었어요! 더 많은 모험이 기다리고 있답니다.</p><button onclick="closeModal()">닫기</button>')}else if(!started){started=true;modal(`<h2>의뢰 수락 · ${quests[quest][0]}</h2><p>${quests[quest][1]} 후 리아에게 돌아오세요.</p><button onclick="closeModal()">수락</button>`);questUI()}else if(done())complete();else modal(`<h2>리아</h2><p>${quests[quest][1]} · 진행 ${progress()}/${quests[quest][2]}</p><button onclick="closeModal()">확인</button>`)}else if(n.kind==='shop'){modal(`<h2>도윤의 잡화점</h2><p>빨간 물약은 HP를 45 회복합니다.</p><button onclick="buyPotion()">물약 구매 · 25 메소</button><button onclick="closeModal()">닫기</button>`)}else{modal(`<h2>${n.name}</h2><p>숲의 의뢰를 완료했다면 마을의 리아에게 돌아가 보상을 받으세요.</p><button onclick="closeModal()">확인</button>`)}}
function progress(){return quest===0?kills:quest===1?mush:cave}function done(){return progress()>=quests[quest][2]}
function complete(){if(!done()){toast('의뢰 목표가 아직 남았어요');return}let rewards=[[45,60],[70,90],[120,160]][quest];exp(rewards[0]);hero.meso+=rewards[1];bag.push({name:'빨간 물약',type:'potion',count:2});if(quest===1)bag.push({name:'초보자 모자',type:'hat',power:2});if(quest===2)bag.push({name:'별가루 검',type:'weapon',power:8});quest++;started=false;closeModal();questUI();say('의뢰 완료! 경험치와 메소를 받았습니다.');toast('의뢰 완료 · 보상 획득');save()}
function jobUp(j){hero.job=j;hero.atk+=j==='검투사'?8:j==='궁수'?5:4;if(j==='마도사'){hero.maxMp+=25;hero.mp=hero.maxMp}closeModal();toast(`${j}(으)로 전직 완료!`);save()}
function buyPotion(){if(hero.meso<25){toast('메소가 부족해요');return}hero.meso-=25;let a=bag.find(i=>i.type==='potion');if(a)a.count++;else bag.push({name:'빨간 물약',type:'potion',count:1});closeModal();toast('물약을 구매했습니다')}
function questUI(){if(quest>=3){$('#qtitle').textContent='의뢰 완료';$('#qdesc').textContent='새로운 모험을 찾아보세요.'}else{$('#qtitle').textContent=started?quests[quest][0]:quest===0?'리아에게 의뢰 받기':`${quests[quest][0]} · 리아에게 대화` $('#qdesc').textContent=started?`${quests[quest][1]} (${progress()}/${quests[quest][2]})`:'NPC를 찾아 대화 버튼을 누르세요.'}}
function status(){$('#who').textContent=hero.job==='초보자'?'별빛 모험가':`${hero.job} 모험가` $('#level').textContent=`Lv.${hero.lv} · ${hero.job}`;$('#hpbar').style.width=100*hero.hp/hero.maxHp+'%';$('#mpbar').style.width=100*hero.mp/hero.maxMp+'%';$('#xpbar').style.width=100*hero.xp/hero.next+'%';$('#meso').textContent=`메소 ${hero.meso}`;$('#pcount').textContent=bag.find(i=>i.type==='potion')?.count||0;$('#skillcd').textContent=hero.skillCd>0?hero.skillCd.toFixed(0):''}
function save(){try{localStorage.setItem('starland-save',JSON.stringify({hero,zoneId,bag,gear,quest,started,kills,mush,cave}))}catch(e){}}
function load(){try{let s=JSON.parse(localStorage.getItem('starland-save'));if(s){Object.assign(hero,s.hero);zoneId=s.zoneId||0;bag=s.bag||bag;gear=s.gear||gear;quest=s.quest||0;started=!!s.started;kills=s.kills||0;mush=s.mush||0;cave=s.cave||0;populate()}}catch(e){}}load();
function inventory(which){let html='';if(which==='bag'){html=bag.map((it,i)=>`<p><b>${it.name}</b> ${it.count?`×${it.count}`:''}<br><button onclick="useItem(${i})">${it.type==='potion'?'사용':'장착'}</button></p>`).join('')||'<p>가방이 비어 있습니다.</p>'}else if(which==='equip'){html=`<p>무기: ${gear.무기||'없음'}<br>모자: ${gear.모자||'없음'}<br>공격력 ${hero.atk} · 방어력 ${hero.def}</p>`}else{html=`<p>기본 공격 — 공격 버튼</p><p>${hero.job==='마도사'?'별똥별':hero.job==='궁수'?'관통 화살':hero.job==='검투사'?'강철 베기':'별빛 베기'} — 스킬 버튼 · MP 18</p><p>남은 스탯 포인트: ${hero.points}</p><button onclick="statUp('atk')">공격 +1</button><button onclick="statUp('hp')">최대 HP +5</button>`}modal(`<h2>${which==='bag'?'가방':which==='equip'?'장비 정보':'스킬/스탯'}</h2>${html}<button onclick="closeModal()">닫기</button>`)}
function useItem(i){let it=bag[i];if(!it)return;if(it.type==='potion'){if(hero.hp===hero.maxHp){toast('HP가 가득 찼어요');return}hero.hp=Math.min(hero.maxHp,hero.hp+45);it.count--;if(it.count<=0)bag.splice(i,1);inventory('bag')}else{let slot=it.type==='weapon'?'무기':'모자';gear[slot]=it.name;if(slot==='무기')hero.atk+=it.power||0;else hero.def+=it.power||0;bag.splice(i,1);inventory('bag');toast(`${it.name} 장착`)}}
function statUp(k){if(hero.points<1){toast('스탯 포인트가 없습니다');return}hero.points--;if(k==='atk')hero.atk++;else{hero.maxHp+=5;hero.hp+=5}inventory('skill')}
window.closeModal=closeModal;window.jobUp=jobUp;window.buyPotion=buyPotion;window.useItem=useItem;window.statUp=statUp;
$('#questBtn').onclick=()=>modal(`<h2>의뢰 목록</h2>${quests.map((q,i)=>`<p>${i<quest?'✅':i===quest?'📜':'🔒'} <b>${q[0]}</b><br>${q[1]}</p>`).join('')}<button onclick="closeModal()">닫기</button>`);$('#bagBtn').onclick=()=>inventory('bag');$('#equipBtn').onclick=()=>inventory('equip');$('#skillBtn').onclick=()=>inventory('skill');
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowleft','arrowright','arrowup'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' ')jump();if(e.key==='ArrowUp')interact();if(e.key.toLowerCase()==='x')attack();if(e.key.toLowerCase()==='c')special();if(e.key.toLowerCase()==='i')inventory('bag')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let stick=$('#stick'),nub=$('#nub'),stickId=null;stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(stickId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,l=Math.abs(dx);moveX=clamp(dx/35,-1,1);nub.style.transform=`translate(${moveX*32}px,${clamp(e.clientY-r.top-r.height/2,-25,25)}px)`}function stickEnd(){stickId=null;moveX=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
$('#attack').addEventListener('pointerdown',e=>{e.preventDefault();attackHeld=true});$('#attack').addEventListener('pointerup',()=>attackHeld=false);$('#attack').addEventListener('pointercancel',()=>attackHeld=false);$('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('#special').addEventListener('pointerdown',e=>{e.preventDefault();special()});$('#talk').onclick=interact;$('#potion').addEventListener('pointerdown',e=>{e.preventDefault();let i=bag.findIndex(a=>a.type==='potion');if(i>=0)useItem(i);else toast('물약이 없습니다')});
function update(dt){t+=dt;hero.atkCd=Math.max(0,hero.atkCd-dt);hero.skillCd=Math.max(0,hero.skillCd-dt);hero.inv=Math.max(0,hero.inv-dt);hero.mp=Math.min(hero.maxMp,hero.mp+2*dt);let dir=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(Math.abs(moveX)>.18)dir=moveX;if(dir){hero.vx=clamp(hero.vx+dir*1500*dt,-205,205);hero.dir=Math.sign(dir)}else hero.vx*=Math.pow(.001,dt);let old=hero.y+hero.h;hero.vy+=1450*dt;hero.x+=hero.vx*dt;hero.y+=hero.vy*dt;hero.ground=false;let z=zones[zoneId];for(let pl of z.plats)if(hero.vy>=0&&old<=pl.y+4&&hero.y+hero.h>=pl.y&&hero.x+hero.w>pl.x&&hero.x<pl.x+pl.w){hero.y=pl.y-hero.h;hero.vy=0;hero.ground=true}hero.x=clamp(hero.x,0,z.w-hero.w);if(hero.y>z.g+130){hero.y=z.g-hero.h;hero.vy=0;hero.hp=Math.max(1,hero.hp-10)}if((keys.arrowup)&&hero.ground)interact();if(attackHeld||keys.x)attack();
 for(let m of mobs){if(m.dead)continue;m.cd-=dt;if(Math.abs(m.x-hero.x)<250){m.x+=(m.x<hero.x?1:-1)*25*dt}if(Math.abs(m.x-hero.x)<28&&Math.abs(m.y-hero.y)<40&&m.cd<=0&&hero.inv<=0&&!z.safe){m.cd=1;hero.hp-=Math.max(1,m.dmg-hero.def);hero.inv=.8;hero.vy=-150;hero.vx=m.x<hero.x?170:-170;if(hero.hp<=0){hero.hp=hero.maxHp;hero.x=100;hero.y=z.g-hero.h;hero.meso=Math.max(0,hero.meso-10);say('기절해 마을 입구로 이동했습니다.')}}}mobs=mobs.filter(m=>!m.dead);
 for(let a of fx){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=350*dt;a.life-=dt}fx=fx.filter(a=>a.life>0);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('on')}cam.x=clamp(hero.x-W*.43,0,Math.max(0,z.w-W));cam.y=clamp(hero.y-H*.5,-50,Math.max(-50,z.g-H));$('#talk').classList.toggle('show',!!nearNpc());if(nearNpc())$('#talk').textContent='대화';else $('#talk').textContent='이동';questUI();status()}
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function draw(){let z=zones[zoneId];cx.save();cx.translate(-Math.round(cam.x),-Math.round(cam.y));let g=cx.createLinearGradient(0,cam.y,0,cam.y+H);g.addColorStop(0,z.sky[0]);g.addColorStop(1,z.sky[1]);cx.fillStyle=g;cx.fillRect(cam.x,cam.y,W,H);for(let i=0;i<7;i++){let x=i*300-cam.x*.15%300+35,y=75+(i%3)*28;rect(x,y,70,12,'#fff7');rect(x+15,y-9,43,11,'#fff8')}cx.fillStyle=z.safe?'#739b6d':'#5f8c64';for(let i=0;i<10;i++){let x=i*230-cam.x*.28%230,y=z.g-20-(i%3)*25;cx.beginPath();cx.moveTo(x,y+100);cx.lineTo(x+95,y-95);cx.lineTo(x+200,y+100);cx.fill()}for(let pl of z.plats){rect(pl.x,pl.y,pl.w,pl.h,zoneId===2?'#514c64':'#67513c');for(let x=pl.x;x<pl.x+pl.w;x+=26){rect(x,pl.y,23,7,zoneId===2?'#78a6a2':'#82b85e');rect(x+7,pl.y+8,12,Math.max(2,pl.h-8),'#826b4c')}}
 if(zoneId===0){rect(200,z.g-72,100,72,'#966b49');rect(185,z.g-93,130,24,'#ba8751');rect(230,z.g-38,29,38,'#e7c476');for(let i=0;i<5;i++){let x=620+i*150;rect(x,z.g-44,14,44,'#765537');rect(x-25,z.g-73,66,40,'#428051')}}else{for(let i=0;i<9;i++){let x=i*220+50;rect(x,z.g-95,12,95,'#71563b');rect(x-31,z.g-130,76,53,zoneId===2?'#526e85':'#377350');rect(x-15,z.g-153,48,35,zoneId===2?'#648699':'#498b59')}}
 for(let n of z.npcs){rect(n.x,z.g-52,26,52,'#65507a');rect(n.x+3,z.g-72,20,22,'#e3b58a');rect(n.x+2,z.g-79,22,10,'#684d42');cx.textAlign='center';cx.font='bold 11px sans-serif';cx.fillStyle='#fff';cx.fillText(n.name,n.x+13,z.g-84);if(Math.abs(n.x-hero.x)<85){cx.fillStyle='#fff0a0';cx.fillText('대화',n.x+13,z.g-98)}}let po=z.portal;rect(po.x,z.g-88,48,88,'#40587a');rect(po.x+7,z.g-78,34,72,'#76d4dc');rect(po.x+13,z.g-68,22,60,'#b5f0e2');
 for(let m of mobs){rect(m.x,m.y+m.h-6,m.w,6,'#46543c');rect(m.x+3,m.y+5,m.w-6,m.h-8,m.color);rect(m.x+6,m.y+m.h-12,m.w-12,7,'#aad071');rect(m.x+7,m.y+8,5,5,'#282d42');rect(m.x+m.w-12,m.y+8,5,5,'#282d42');rect(m.x,m.y-8,m.w,4,'#352b3c');rect(m.x,m.y-8,m.w*m.hp/m.max,4,'#ef6b70');cx.fillStyle='#fff';cx.font='9px sans-serif';cx.textAlign='center';cx.fillText(m.name,m.x+m.w/2,m.y-11)}
 let bob=hero.ground&&Math.abs(hero.vx)>15?Math.sin(t*14)*2:0;cx.save();cx.translate(Math.round(hero.x+hero.w/2),Math.round(hero.y+bob));cx.scale(hero.dir,1);cx.globalAlpha=hero.inv>0&&Math.floor(t*12)%2?.45:1;rect(-12,34,9,13,'#514032');rect(3,34,9,13,'#514032');rect(-13,15,26,22,hero.job==='마도사'?'#6655a0':hero.job==='궁수'?'#45815b':'#455c99');rect(-10,19,20,11,'#788bc6');rect(-11,1,22,17,'#e1af80');rect(-11,-5,22,9,'#69473c');rect(-8,5,4,4,'#29334b');rect(4,5,4,4,'#29334b');rect(12,15,24,4,'#ded9c6');cx.restore();cx.globalAlpha=1;for(let a of fx)rect(a.x,a.y,4,4,a.c);cx.restore()}
function loop(now){let dt=Math.min(.035,(now-(loop.last||now))/1000);loop.last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);questUI();status();
