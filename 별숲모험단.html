<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#18243b">
<title>별숲 모험단</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18243b;touch-action:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;color:white}.status,.gold,.help,.action,.stick{position:absolute}.status{left:12px;top:12px;width:210px;padding:10px 12px;border:1px solid #ffffff20;border-radius:15px;background:#18243be8;box-shadow:0 5px 20px #0003}.name{font-size:14px;font-weight:800;margin-bottom:7px}.bar{height:9px;border-radius:8px;background:#382d42;margin:5px 0;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;transition:width .12s}.hp i{background:linear-gradient(90deg,#ff647b,#ff9b82)}.mp i{background:linear-gradient(90deg,#39a8ff,#70e0ff)}.stats{font-size:11px;color:#ffedab;display:flex;justify-content:space-between;margin-top:6px}.gold{right:12px;top:12px;border-radius:12px;background:#18243be8;padding:10px 13px;color:#ffe27a;font-weight:800}.help{top:112px;left:14px;color:#fff9;font-size:11px}.stick{display:none;left:24px;bottom:25px;width:118px;height:118px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff38;pointer-events:auto;touch-action:none}.nub{position:absolute;left:36px;top:36px;width:42px;height:42px;border-radius:50%;background:#ffffff70;box-shadow:0 2px 8px #0003;pointer-events:none}.actions{position:absolute;right:17px;bottom:22px;display:none;align-items:flex-end;gap:10px;pointer-events:auto}.action{position:relative;inset:auto;width:68px;height:68px;border:2px solid #ffffff50;border-radius:50%;background:#273a59dd;color:white;font-size:12px;font-weight:800;box-shadow:0 4px 12px #0004;touch-action:none}.action.attack{width:82px;height:82px;background:#da7655e8;font-size:14px}.action.skill{background:#3187afe8}.action.potion{background:#39885ce8}.action:active{transform:scale(.94)}.desktop-tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:12px;background:#18243bcc;font-size:12px;color:#ffffffc9;white-space:nowrap}.toast{position:absolute;top:28%;left:50%;transform:translateX(-50%);font-size:23px;font-weight:900;color:#ffed86;text-shadow:0 2px 4px #322;white-space:nowrap;opacity:0;transition:opacity .2s}.toast.show{opacity:1}@media(pointer:coarse),(max-width:700px){.stick,.actions{display:flex}.help,.desktop-tip{display:none}.status{width:185px;padding:8px 10px}.name{font-size:12px}.gold{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<canvas id="game" aria-label="별숲 모험단 게임"></canvas>
<div class="hud">
  <div class="status"><div class="name" id="name">Lv.1 별빛 모험가</div><div class="bar hp"><i id="hpbar"></i></div><div class="bar mp"><i id="mpbar"></i></div><div class="stats"><span id="xp">경험치 0/100</span><span id="potions">물약 3개</span></div></div>
  <div class="gold" id="gold">◆ 0</div>
  <div class="help">이동: WASD / 방향키 · 공격: 마우스 / 스페이스 · 기술: Q · 물약: E</div>
  <div class="desktop-tip">적을 물리치고 경험치를 모아 레벨을 올리세요!</div>
  <div class="toast" id="toast"></div>
  <div class="stick" id="stick"><div class="nub" id="nub"></div></div>
  <div class="actions"><button class="action skill" id="skill">별빛<br>Q</button><button class="action potion" id="potion">물약<br>E</button><button class="action attack" id="attack">공격</button></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const ui={hp:document.getElementById('hpbar'),mp:document.getElementById('mpbar'),xp:document.getElementById('xp'),name:document.getElementById('name'),gold:document.getElementById('gold'),potions:document.getElementById('potions'),toast:document.getElementById('toast')};
let W=innerWidth,H=innerHeight,dpr=1;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const world={w:1900,h:1200},cam={x:0,y:0};
const hero={x:950,y:600,r:19,speed:255,angle:0,hp:100,maxHp:100,mp:60,maxMp:60,level:1,xp:0,next:100,gold:0,potions:3,attackCD:0,skillCD:0,invuln:0};
let mobs=[],shots=[],sparks=[],floats=[],spawnCD=0,last=performance.now(),shake=0;
const input={x:0,y:0,attack:false,aimX:W/2,aimY:H/2};
const keys={};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(){let a=Math.random()*Math.PI*2,d=Math.max(W,H)*.65+60,x=clamp(hero.x+Math.cos(a)*d,30,world.w-30),y=clamp(hero.y+Math.sin(a)*d,30,world.h-30),elite=mobs.length>4&&Math.random()<.14,hp=elite?100+hero.level*12:38+hero.level*7;mobs.push({x,y,r:elite?27:18,hp,max:hp,speed:elite?66:76+Math.random()*22,damage:elite?17:8+hero.level,cd:0,elite,angle:0})}
for(let i=0;i<6;i++)spawn();
function fire(){if(hero.attackCD>0)return;hero.attackCD=.25;let x=Math.cos(hero.angle),y=Math.sin(hero.angle);shots.push({x:hero.x+x*26,y:hero.y+y*26,vx:x*570,vy:y*570,r:6,life:.85,damage:20+hero.level*3,color:'#ffe78b'});for(let i=0;i<4;i++)spark(hero.x+x*28,hero.y+y*28,'#fff2b0')}
function burst(){if(hero.skillCD>0||hero.mp<22)return;hero.mp-=22;hero.skillCD=4;shake=7;for(let i=0;i<20;i++){let a=i*Math.PI/10;shots.push({x:hero.x,y:hero.y,vx:Math.cos(a)*350,vy:Math.sin(a)*350,r:8,life:1,damage:32+hero.level*5,color:'#70dcff'})}}
function potion(){if(hero.potions<1||hero.hp>=hero.maxHp)return;hero.potions--;hero.hp=Math.min(hero.maxHp,hero.hp+42);floats.push({x:hero.x,y:hero.y-35,text:'+ 체력',life:1,color:'#7dff9c'})}
function spark(x,y,color){sparks.push({x,y,vx:(Math.random()-.5)*150,vy:(Math.random()-.5)*150,life:.35,max:.35,color,r:2+Math.random()*3})}
function levelUp(){while(hero.xp>=hero.next){hero.xp-=hero.next;hero.level++;hero.next=Math.floor(hero.next*1.3);hero.maxHp+=15;hero.maxMp+=8;hero.hp=hero.maxHp;hero.mp=hero.maxMp;hero.potions=Math.min(9,hero.potions+1);floats.push({x:hero.x,y:hero.y-50,text:`레벨 ${hero.level}!`,life:1.6,color:'#ffe66d'})}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){input.aimX=e.clientX;input.aimY=e.clientY}});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){input.attack=true;input.aimX=e.clientX;input.aimY=e.clientY}});addEventListener('pointerup',e=>{if(e.pointerType==='mouse')input.attack=false});
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=39,k=len>max?max/len:1;input.x=dx*k/max;input.y=dy*k/max;nub.style.transform=`translate(${dx*k}px,${dy*k}px)`}
function releaseStick(){stickId=null;input.x=input.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
const attackBtn=document.getElementById('attack');attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();attackBtn.setPointerCapture(e.pointerId);input.attack=true});attackBtn.addEventListener('pointerup',()=>input.attack=false);attackBtn.addEventListener('pointercancel',()=>input.attack=false);
document.getElementById('skill').addEventListener('pointerdown',e=>{e.preventDefault();burst()});document.getElementById('potion').addEventListener('pointerdown',e=>{e.preventDefault();potion()});
function update(dt){hero.attackCD=Math.max(0,hero.attackCD-dt);hero.skillCD=Math.max(0,hero.skillCD-dt);hero.invuln-=dt;hero.mp=Math.min(hero.maxMp,hero.mp+4*dt);shake*=.84;
 let dx=input.x,dy=input.y;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(dx||dy){let l=Math.hypot(dx,dy);hero.x=clamp(hero.x+dx/l*hero.speed*dt,24,world.w-24);hero.y=clamp(hero.y+dy/l*hero.speed*dt,24,world.h-24)}
 if(input.x||input.y){let tx=hero.x+input.x*100,ty=hero.y+input.y*100;hero.angle=Math.atan2(ty-hero.y,tx-hero.x)}else hero.angle=Math.atan2(input.aimY+cam.y-hero.y,input.aimX+cam.x-hero.x);
 if(input.attack||keys[' '])fire();if(keys.q){burst();keys.q=false}if(keys.e){potion();keys.e=false}
 spawnCD-=dt;if(spawnCD<=0&&mobs.length<10+hero.level){spawn();spawnCD=Math.max(.65,2.1-hero.level*.07)}
 for(const p of shots){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
 for(const m of mobs){m.cd-=dt;let a=Math.atan2(hero.y-m.y,hero.x-m.x);m.angle=a;m.x+=Math.cos(a)*m.speed*dt;m.y+=Math.sin(a)*m.speed*dt;if(distance(m,hero)<m.r+hero.r&&m.cd<=0&&hero.invuln<=0){m.cd=.8;hero.hp-=m.damage;hero.invuln=.55;shake=8;floats.push({x:hero.x,y:hero.y-30,text:`-${m.damage}`,life:.7,color:'#ff7777'});if(hero.hp<=0){hero.hp=hero.maxHp;hero.x=world.w/2;hero.y=world.h/2;hero.gold=Math.max(0,hero.gold-10);floats.push({x:hero.x,y:hero.y-45,text:'마을에서 다시 시작!',life:1.5,color:'#fff'})}}}
 for(const p of shots)if(p.life>0)for(const m of mobs)if(p.life>0&&distance(p,m)<p.r+m.r){m.hp-=p.damage;p.life=0;for(let i=0;i<5;i++)spark(m.x,m.y,m.elite?'#d3a5ff':'#ffa07c')}
 mobs=mobs.filter(m=>{if(m.hp<=0){hero.xp+=m.elite?35:18;hero.gold+=m.elite?12:5;for(let i=0;i<10;i++)spark(m.x,m.y,'#9beba1');return false}return true});levelUp();shots=shots.filter(p=>p.life>0);sparks=sparks.filter(p=>(p.life-=dt)>0);floats=floats.filter(t=>(t.life-=dt)>0);
 cam.x=clamp(hero.x-W/2,0,Math.max(0,world.w-W));cam.y=clamp(hero.y-H/2,0,Math.max(0,world.h-H));
 ui.hp.style.width=`${100*hero.hp/hero.maxHp}%`;ui.mp.style.width=`${100*hero.mp/hero.maxMp}%`;ui.name.textContent=`Lv.${hero.level} 별빛 모험가`;ui.xp.textContent=`경험치 ${hero.xp}/${hero.next}`;ui.gold.textContent=`◆ ${hero.gold}`;ui.potions.textContent=`물약 ${hero.potions}개`;
}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.save();ctx.translate(-cam.x+(Math.random()-.5)*shake,-cam.y+(Math.random()-.5)*shake);
 ctx.fillStyle='#87c979';ctx.fillRect(0,0,world.w,world.h);for(let y=0;y<world.h;y+=72)for(let x=(y/72%2)*36;x<world.w;x+=72){ctx.fillStyle='#79bd6d';ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill()}
 for(let i=0;i<75;i++){let x=(i*197+83)%world.w,y=(i*131+49)%world.h;ctx.fillStyle=i%3?'#5ea75a':'#d7d17c';ctx.beginPath();ctx.arc(x,y,3+i%3,0,Math.PI*2);ctx.fill()}
 // 작은 숲속 마을 오두막
 ctx.fillStyle='#765b42';ctx.fillRect(world.w/2-77,world.h/2-24,154,58);ctx.fillStyle='#a57b52';ctx.beginPath();ctx.moveTo(world.w/2-99,world.h/2-24);ctx.lineTo(world.w/2,world.h/2-82);ctx.lineTo(world.w/2+99,world.h/2-24);ctx.fill();ctx.fillStyle='#f6d88e';ctx.fillRect(world.w/2-12,world.h/2+5,24,29);
 for(const m of mobs){ctx.save();ctx.translate(m.x,m.y);ctx.rotate(m.angle);ctx.fillStyle=m.elite?'#8063ad':'#82a552';ctx.beginPath();ctx.ellipse(0,0,m.r,m.r*.82,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=m.elite?'#ccb1ff':'#c6df7b';ctx.beginPath();ctx.moveTo(-m.r*.7,-m.r*.4);ctx.lineTo(-m.r*.35,-m.r*1.2);ctx.lineTo(0,-m.r*.5);ctx.lineTo(m.r*.6,-m.r*1.1);ctx.lineTo(m.r*.7,-m.r*.4);ctx.fill();ctx.fillStyle='#29263a';ctx.beginPath();ctx.arc(7,-3,3,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#402e36';ctx.fillRect(m.x-m.r,m.y-m.r-10,m.r*2,4);ctx.fillStyle='#ef6d67';ctx.fillRect(m.x-m.r,m.y-m.r-10,m.r*2*Math.max(0,m.hp/m.max),4)}
 for(const p of shots){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}
 for(const p of sparks){ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 // player shadow and cute adventurer
 ctx.fillStyle='#34534588';ctx.beginPath();ctx.ellipse(hero.x,hero.y+20,22,7,0,0,Math.PI*2);ctx.fill();ctx.save();ctx.translate(hero.x,hero.y);ctx.rotate(hero.angle);ctx.globalAlpha=hero.invuln>0&&Math.floor(performance.now()/80)%2?.45:1;ctx.fillStyle='#d99b69';ctx.beginPath();ctx.arc(0,-5,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#586283';ctx.beginPath();ctx.moveTo(-17,5);ctx.quadraticCurveTo(0,18,17,5);ctx.lineTo(13,25);ctx.lineTo(-13,25);ctx.fill();ctx.fillStyle='#6b513d';ctx.beginPath();ctx.arc(-1,-13,17,Math.PI,0);ctx.lineTo(16,-4);ctx.lineTo(-16,-4);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-7,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3dfb2';ctx.fillRect(15,-2,21,5);ctx.restore();ctx.globalAlpha=1;
 ctx.textAlign='center';ctx.font='bold 17px sans-serif';for(const t of floats){ctx.globalAlpha=Math.min(1,t.life);ctx.fillStyle=t.color;ctx.fillText(t.text,t.x,t.y-(1.4-t.life)*20)}ctx.globalAlpha=1;ctx.restore();
 if(hero.skillCD>0){ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(`${hero.skillCD.toFixed(1)}초`,W-140,H-102)}
}
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
